<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file:" />
  <title>BookBin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="banner-root"></div>

      </div>

      <div id="sidebar-footer"></div>
    </aside>

  </div>
  <div id="modal-root"></div>

  <script src="helpers.js"></script>
  <script src="login.js"></script>
  <script src="invoice-template.js"></script>
  <script src="screens/dashboard.js"></script>
  <script src="screens/items.js"></script>
  <script src="screens/vendors.js"></script>
  <script src="screens/customers.js"></script>
  <script src="screens/incoming-invoices.js"></script>
  <script src="screens/outgoing-invoices.js"></script>
  <script src="screens/purchase-orders.js"></script>
