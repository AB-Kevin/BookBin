apply plugin: 'com.android.application'

// The version comes from package.json, so `npm version` bumps the APK along
// with the desktop builds. versionCode must only ever go up: 2.1.1 -> 20101.
def packageVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
def (major, minor, patch) = packageVersion.tokenize('.-')[0..2].collect { it as int }

// The release signing key. CI passes it in environment variables (see
// .github/workflows/release.yml); a local build reads android/keystore.properties,
// which is gitignored. Every release must be signed with the same key, or
// installed copies refuse the update -- back it up.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String env, String prop -> System.getenv(env) ?: keystoreProps.getProperty(prop) }
def releaseStoreFile = signingValue('ANDROID_KEYSTORE_FILE', 'storeFile')

android {
    namespace = "com.bookbin.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bookbin.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode major * 10000 + minor * 100 + patch
        versionName packageVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Without a key the release build still runs, but comes out
            // unsigned, which no phone will install.
            if (releaseStoreFile) signingConfig signingConfigs.release
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "BookBin-${packageVersion}${variant.buildType.name == 'release' ? '' : '-' + variant.buildType.name}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
